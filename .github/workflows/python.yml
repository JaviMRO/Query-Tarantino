name: Python

on:
  push:
    paths:
      - "Query_Tarantino_Python/**"
      - "shared/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "Query_Tarantino_Python/**"
      - "shared/**"
      - ".github/workflows/python.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Query_Tarantino_Python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: Query_Tarantino_Python/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy src tests

      - name: Tests
        run: pytest
