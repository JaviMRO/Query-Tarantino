[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ERA",
    "TID",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "scripts"
exclude = ["\\.venv/"]
